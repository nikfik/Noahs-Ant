<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/MainColors.css">
    <link rel="stylesheet" href="../styles/E_ProjectLists.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="tabs">
                <span class="tab active">Local</span>
                <span class="tab">Cloud</span>
                <span class="tab">Github</span>
                <span class="tab settings-tab">Settings</span>
            </div>
            <div class="app-title">AntNest</div>
            <div class="top-icons">
                <span><img src="https://cdn-icons-png.flaticon.com/512/1779/1779545.png" alt="logo" width="40"></span>
            </div>
        </header>

        <main>
            <h2>Projects</h2>
            <div id="project-grid" class="project-grid"></div>
        </main>

        <footer>
            <div class="left-buttons">
                <button class="btn-outline">Export</button>
                <button class="btn-outline">Import</button>
            </div>
            <div class="right-buttons">
                <button id="new-project-btn" class="btn-outline">New Project</button>
                <button id="open-project-btn" class="btn-primary">Open</button>
            </div>
        </footer>
        <div class="project-panel">
            <div id="project-status" class="project-status">Brak aktywnego projektu</div>
        </div>

    </div>

    <div id="project-modal" class="modal hidden">
        <div class="modal-card">
            <h3>Utwórz nowy projekt</h3>
            <p>Wprowadź nazwę projektu, aby zapisać go w folderze <strong>Projects</strong>.</p>
            <form id="project-modal-form">
                <label for="project-name">Nazwa projektu</label>
                <input id="project-name" name="project-name" type="text" placeholder="Badanie Szczurów - Lab 3" required>
                <div id="project-name-error" class="input-error"></div>
                <div class="modal-actions">
                    <button type="button" id="project-cancel-btn" class="btn-outline">Anuluj</button>
                    <button type="submit" class="btn-primary">Utwórz</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../scripts/project-utils.js"></script>
    <script src="../scripts/renderer.js"></script>
</body>
</html>
