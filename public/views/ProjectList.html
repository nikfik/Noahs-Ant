<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noah’s Ant</title>
    <link rel="stylesheet" href="../styles/MainColors.css">
    <link rel="stylesheet" href="../styles/E_ProjectLists.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="app-title">Noah’s Ant</div>
            <div class="top-icons">
                <span><img src="../assets/anticon-256.png" alt="logo" width="40"></span>
            </div>
        </header>

        <main>
            <div class="list-heading">
                <h2 data-i18n>Projekty</h2>
                <label class="list-sort"><span data-i18n>Sortuj</span>
                    <select id="project-sort" aria-label="Sortowanie projektów" data-i18n-aria-label="Sortowanie projektów">
                        <option value="opened" data-i18n>Ostatnio otwarte</option>
                        <option value="name" data-i18n>Nazwa (A–Z)</option>
                        <option value="created" data-i18n>Najnowsze</option>
                    </select>
                </label>
            </div>
            <div id="project-grid" class="project-grid"></div>
            <p id="project-message" class="project-message" role="status"></p>
        </main>

        <footer>
            <div class="left-buttons">
                <button id="new-project-btn" class="btn-outline" data-i18n>Nowy projekt</button>
                <button id="import-project-btn" class="btn-outline" title="Wczytaj projekt z pliku .nsant jako nowy projekt" data-i18n-title="Wczytaj projekt z pliku .nsant jako nowy projekt" data-i18n>Import</button>
            </div>
            <input id="project-search" class="project-search" type="search" placeholder="Szukaj projektu…" aria-label="Szukaj projektu" data-i18n-placeholder="Szukaj projektu…" data-i18n-aria-label="Szukaj projektu" autocomplete="off">
            <div class="right-buttons">
                <button id="settings-btn" class="btn-outline" data-i18n>Ustawienia</button>
            </div>
        </footer>
    </div>

    <div id="project-modal" class="modal hidden">
        <div class="modal-card">
            <h3 data-i18n>Utwórz nowy projekt</h3>
            <p data-i18n>Wprowadź nazwę projektu, aby zapisać go w folderze Projects.</p>
            <form id="project-modal-form">
                <label for="project-name" data-i18n>Nazwa projektu</label>
                <input id="project-name" name="project-name" type="text" placeholder="Badanie Szczurów - Lab 3" data-i18n-placeholder="Badanie Szczurów - Lab 3" required>
                <div id="project-name-error" class="input-error"></div>
                <div class="modal-actions">
                    <button type="button" id="project-cancel-btn" class="btn-outline" data-i18n>Anuluj</button>
                    <button type="submit" class="btn-primary" data-i18n>Utwórz</button>
                </div>
            </form>
        </div>
    </div>

    <div id="export-modal" class="modal hidden">
        <div class="modal-card">
            <h3 data-export-title>Eksportuj projekt</h3>
            <label class="export-option"><input type="checkbox" data-include-videos> <span data-i18n>Dołącz filmy</span></label>
            <p class="export-videos-info" data-videos-info></p>
            <p class="export-warning" data-videos-warning hidden></p>
            <div class="modal-actions">
                <button type="button" class="btn-outline" data-export-cancel data-i18n>Anuluj</button>
                <button type="button" class="btn-primary" data-export-confirm data-i18n>Eksportuj…</button>
            </div>
        </div>
    </div>

    <div id="info-modal" class="modal hidden">
        <div class="modal-card">
            <h3 data-info-title>Informacje</h3>
            <table class="info-table"><tbody data-info-body></tbody></table>
            <div class="modal-actions">
                <button type="button" class="btn-primary" data-info-close data-i18n>Zamknij</button>
            </div>
        </div>
    </div>

    <div id="delete-modal" class="modal hidden">
        <div class="modal-card">
            <h3 data-i18n>Usuń projekt</h3>
            <p data-delete-text></p>
            <div class="modal-actions">
                <button type="button" class="btn-outline" data-delete-cancel data-i18n>Anuluj</button>
                <button type="button" class="btn-danger" data-delete-confirm data-i18n>Przenieś do Kosza</button>
            </div>
        </div>
    </div>

    <script type="module" src="../scripts/app/project-list-init.js"></script>
</body>
</html>
