<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/MainColors.css">
    <link rel="stylesheet" href="../styles/E_ProjectLists.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="tabs">
                <span class="tab active">Local</span>
                <span class="tab">Cloud</span>
                <span class="tab">Github</span>
                <span class="tab settings-tab">Settings</span>
            </div>
            <div class="app-title">AntNest</div>
            <div class="top-icons">
                <span><img src="https://cdn-icons-png.flaticon.com/512/1779/1779545.png" alt="logo" width="40"></span>
            </div>
        </header>

        <main>
            <h2>Projects</h2>
            <div id="project-grid" class="project-grid"></div>
            <p id="project-message" class="project-message" role="status"></p>
        </main>

        <footer>
            <div class="left-buttons">
                <button id="export-project-btn" class="btn-outline" title="Zapisz zaznaczony projekt do pliku .nsant">Export</button>
                <button id="import-project-btn" class="btn-outline" title="Wczytaj projekt z pliku .nsant jako nowy projekt">Import</button>
            </div>
            <div class="right-buttons">
                <button id="new-project-btn" class="btn-outline">New Project</button>
                <button id="open-project-btn" class="btn-primary">Open</button>
            </div>
        </footer>
    </div>

    <div id="project-modal" class="modal hidden">
        <div class="modal-card">
            <h3>Utwórz nowy projekt</h3>
            <p>Wprowadź nazwę projektu, aby zapisać go w folderze <strong>Projects</strong>.</p>
            <form id="project-modal-form">
                <label for="project-name">Nazwa projektu</label>
                <input id="project-name" name="project-name" type="text" placeholder="Badanie Szczurów - Lab 3" required>
                <div id="project-name-error" class="input-error"></div>
                <div class="modal-actions">
                    <button type="button" id="project-cancel-btn" class="btn-outline">Anuluj</button>
                    <button type="submit" class="btn-primary">Utwórz</button>
                </div>
            </form>
        </div>
    </div>

    <div id="export-modal" class="modal hidden">
        <div class="modal-card">
            <h3 data-export-title>Eksportuj projekt</h3>
            <label class="export-option"><input type="checkbox" data-include-videos> Dołącz filmy</label>
            <p class="export-videos-info" data-videos-info></p>
            <p class="export-warning" data-videos-warning hidden></p>
            <div class="modal-actions">
                <button type="button" class="btn-outline" data-export-cancel>Anuluj</button>
                <button type="button" class="btn-primary" data-export-confirm>Eksportuj…</button>
            </div>
        </div>
    </div>

    <script type="module" src="../scripts/app/project-list-init.js"></script>
</body>
</html>
