<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noah’s Ant</title>
    <link rel="stylesheet" href="../styles/MainColors.css">
    <link rel="stylesheet" href="../styles/Settings.css">
</head>
<body>
    <div class="settings-app">

        <div class="settings-layout">
            <aside class="settings-sidebar">
                <nav id="settings-tabs" class="settings-tabs" aria-label="Przegląd ustawień" data-i18n-aria-label="Przegląd ustawień"></nav>
            </aside>

            <main class="settings-content">
                <div class="settings-header-row">
                    <h2 id="settings-section-title">Ogólne</h2>
                </div>

                <div id="settings-options" class="settings-options" aria-live="polite"></div>

                <div class="settings-footer">
                    <button id="apply-btn" type="button" data-i18n>Zastosuj</button>
                    <button id="reset-btn" type="button" class="secondary" data-i18n>Przywróć domyślne</button>
                </div>
            </main>
        </div>
    </div>

    <script type="module" src="../scripts/theme/theme-service.js"></script>
    <script type="module" src="../scripts/settings/settings.js"></script>
</body>
</html>
