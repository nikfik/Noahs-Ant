<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AntNest Workspace</title>
    <link rel="stylesheet" href="../styles/MainColors.css">
    <link rel="stylesheet" href="../styles/Workspace.css">
    <link rel="stylesheet" href="../styles/Toolbar.css">
</head>
<body>
    <div class="workspace-inner">
        <aside class="left-sidebar">
            <div id="etogram-module"></div>
        </aside>

        <main class="workspace-main">
            <div class="video-area">
                <div id="video-module"></div>
                <div id="events-module"></div>
            </div>
        </main>
    </div>

    <nav id="bottom-toolbar" class="bottom-toolbar" aria-label="Workspace toolbar">
        <button data-view="view-video" class="tb-btn active" data-icon-type="emoji" data-icon-value="▶">
            <span class="tb-icon" aria-hidden="true"></span>
            <span class="tb-label">Wideo</span>
        </button>
        <button data-view="view-animals" class="tb-btn" data-icon-type="emoji" data-icon-value="🦊">
            <span class="tb-icon" aria-hidden="true"></span>
            <span class="tb-label">Zwierzęta</span>
        </button>
        <button data-view="view-analysis" class="tb-btn" data-icon-type="emoji" data-icon-value="📈">
            <span class="tb-icon" aria-hidden="true"></span>
            <span class="tb-label">Wykresy</span>
        </button>

        <div class="toolbar-actions" aria-label="Quick actions">
            <button id="back-to-projects" class="toolbar-action" data-icon-type="emoji" data-icon-value="←">
                <span class="tb-icon" aria-hidden="true"></span>
                <span class="tb-label">Projekty</span>
            </button>
            <button id="options-btn" class="toolbar-action" data-icon-type="emoji" data-icon-value="⚙">
                <span class="tb-icon" aria-hidden="true"></span>
                <span class="tb-label">Opcje</span>
            </button>
        </div>
    </nav>

    <script src="../scripts/services/AppState.js"></script>
    <script src="../scripts/ui/ui-toolbar.js"></script>
    <script src="../scripts/workspace/workspace-toolbar.js"></script>
    <script src="../scripts/workspace/workspace-etogram-module.js"></script>
    <script src="../scripts/workspace/video/VideoPlayerUtils.js"></script>
    <script src="../scripts/workspace/video/VideoIOService.js"></script>
    <script src="../scripts/workspace/video/VideoPlaybackControls.js"></script>
    <script src="../scripts/workspace/video/VideoZoomControls.js"></script>
    <script src="../scripts/workspace/video/VideoPlayerUI.js"></script>
    <script src="../scripts/workspace/video/VideoPlayerController.js"></script>
    <script src="../scripts/workspace/workspace-video-module.js"></script>
    <script src="../scripts/workspace/workspace-events-module.js"></script>
    <script src="../scripts/workspace/workspace-page.js"></script>
</body>
</html>
