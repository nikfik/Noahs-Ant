<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AntNest Workspace</title>
    <link rel="stylesheet" href="../styles/MainColors.css">
    <link rel="stylesheet" href="../styles/Workspace.css">
    <link rel="stylesheet" href="../styles/E_SidePanels.css">
    <link rel="stylesheet" href="../styles/E_AnimalPanel.css">
    <link rel="stylesheet" href="../styles/E_DataPanel.css">
    <link rel="stylesheet" href="../styles/Toolbar.css">
</head>
<body>
    <div id="view-video" class="workspace-view">
        <div class="workspace-inner">
            <aside class="left-sidebar">
                <div id="trial-panel"></div>
                <div id="animal-panel"></div>
                <div id="etogram-module"></div>
            </aside>

            <main class="workspace-main">
                <div class="video-area">
                    <div id="video-module"></div>
                    <div id="events-module"></div>
                </div>
            </main>
        </div>
    </div>

    <div id="view-data" class="workspace-view" hidden>
        <nav class="data-tabs" aria-label="Dane">
            <button type="button" class="data-tab active" data-data-tab="events">Zdarzenia</button>
            <button type="button" class="data-tab" data-data-tab="metrics">Metryki</button>
        </nav>
        <div id="data-module" data-data-panel="events"></div>
        <div id="data-metrics-module" data-data-panel="metrics" hidden></div>
    </div>

    <div id="view-analysis" class="workspace-view" hidden>
        <section class="module-card analysis-placeholder">
            <h3>Wykresy</h3>
            <p>Ten ekran pojawi się wkrótce.</p>
        </section>
    </div>

    <nav id="bottom-toolbar" class="bottom-toolbar" aria-label="Workspace toolbar">
        <button data-view="view-video" class="tb-btn active" data-icon-type="emoji" data-icon-value="">
            <span class="tb-icon" aria-hidden="true"></span>
            <span class="tb-label">Wideo</span>
        </button>
        <button data-view="view-data" class="tb-btn" data-icon-type="emoji" data-icon-value="">
            <span class="tb-icon" aria-hidden="true"></span>
            <span class="tb-label">Dane</span>
        </button>
        <button data-view="view-analysis" class="tb-btn" data-icon-type="emoji" data-icon-value="">
            <span class="tb-icon" aria-hidden="true"></span>
            <span class="tb-label">Wykresy</span>
        </button>

        <div class="toolbar-actions" aria-label="Quick actions">
            <button id="back-to-projects" class="toolbar-action" data-icon-type="emoji" data-icon-value="←">
                <span class="tb-icon" aria-hidden="true"></span>
                <span class="tb-label">Projekty</span>
            </button>
            <button id="options-btn" class="toolbar-action" data-icon-type="emoji" data-icon-value="⚙">
                <span class="tb-icon" aria-hidden="true"></span>
                <span class="tb-label">Opcje</span>
            </button>
        </div>
    </nav>

    <script type="module" src="../scripts/workspace/workspace-init.js"></script>
</body>
</html>
