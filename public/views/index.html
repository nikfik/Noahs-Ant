<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" type="text/css" href="../styles/styleE1.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="tabs">
                <span class="tab active">Local</span>
                <span class="tab">Cloud</span>
                <span class="tab">Github</span>
            </div>
            <div class="app-title">AntNest</div>
            <div class="top-icons">
                <span><img src="https://cdn-icons-png.flaticon.com/512/1779/1779545.png" alt="logo" width="40"></span>
            </div>
        </header>

        <main>
            <h2>Projects</h2>
            <div class="project-grid">
                <div class="project-card active">
                    <div class="thumbnail">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/4/4d/DaVinci_Resolve_Studio_16_icon.png" alt="logo" width="40">
                    </div>
                    <p class="project-name">Untitled Project</p>
                </div>
            </div>
        </main>

        <footer>
            <div class="left-buttons">
                <button class="btn-outline">Export</button>
                <button class="btn-outline">Import</button>
            </div>
            <div class="right-buttons">
                <button class="btn-outline">New Project</button>
                <button class="btn-primary">Open</button>
            </div>
        </footer>
    </div>
</body>
</html>
